name: Publish skim-python to PyPI

on:
  push:
    tags:
      - 'python/skim-py/v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build distribution and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing (OIDC)
      contents: read
    defaults:
      run:
        working-directory: python/skim-py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Run Unit Tests
        run: |
          uv run python -m unittest discover -s tests

      - name: Build binary wheel and sdist
        run: |
          uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/skim-py/dist/
